[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

[functions.market-scanner-cron]
  schedule = "@hourly"

[functions.daily-company-intake]
  schedule = "0 6 * * *"
